<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ .Name }} will be up shortly - ZipNap</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
          Cantarell, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        overflow: hidden;
      }

      .container {
        text-align: center;
        max-width: 600px;
        padding: 2rem;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      }

      .logo {
        font-size: 3rem;
        font-weight: bold;
        margin-bottom: 1rem;
        background: linear-gradient(45deg, #ff6b6b, #ffd93d);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .title {
        font-size: 2.5rem;
        font-weight: 300;
        margin-bottom: 1rem;
        letter-spacing: -0.02em;
      }

      .subtitle {
        font-size: 1.2rem;
        margin-bottom: 2rem;
        opacity: 0.9;
        line-height: 1.6;
      }

      .spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top: 4px solid white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 2rem auto;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .refresh-info {
        font-size: 0.9rem;
        opacity: 0.7;
        margin-top: 2rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
      }

      .countdown {
        font-weight: bold;
        color: #ffd93d;
      }

      .floating-shapes {
        position: absolute;
        width: 100%;
        height: 100%;
        overflow: hidden;
        z-index: -1;
      }

      .shape {
        position: absolute;
        opacity: 0.1;
        animation: float 6s ease-in-out infinite;
      }

      .shape:nth-child(1) {
        left: 10%;
        top: 20%;
        animation-delay: 0s;
      }

      .shape:nth-child(2) {
        left: 20%;
        top: 80%;
        animation-delay: 2s;
      }

      .shape:nth-child(3) {
        left: 60%;
        top: 40%;
        animation-delay: 4s;
      }

      .shape:nth-child(4) {
        left: 80%;
        top: 70%;
        animation-delay: 1s;
      }

      .shape:nth-child(5) {
        left: 70%;
        top: 10%;
        animation-delay: 3s;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0px) rotate(0deg);
        }
        50% {
          transform: translateY(-20px) rotate(180deg);
        }
      }

      .circle {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: white;
      }

      .square {
        width: 50px;
        height: 50px;
        background: white;
        transform: rotate(45deg);
      }

      .triangle {
        width: 0;
        height: 0;
        border-left: 25px solid transparent;
        border-right: 25px solid transparent;
        border-bottom: 43px solid white;
      }

      @media (max-width: 768px) {
        .container {
          margin: 1rem;
          padding: 1.5rem;
        }

        .title {
          font-size: 2rem;
        }

        .subtitle {
          font-size: 1rem;
        }

        .logo {
          font-size: 2.5rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="floating-shapes">
      <div class="shape circle"></div>
      <div class="shape square"></div>
      <div class="shape triangle"></div>
      <div class="shape circle"></div>
      <div class="shape square"></div>
    </div>

    <div class="container">
      <div class="logo">{{ .Name }}</div>
      <h1 class="title">will be up shortly ...</h1>
      <p class="subtitle">Hang tight! Cogs are turning.</p>
      <div class="spinner"></div>
      <div class="refresh-info">
        <span>Will auto-refresh automatically</span>
      </div>
    </div>

    <script>
      // Auto-refresh functionality
      const refreshAt = new Date(Date.now() + {{.RefreshIntervalSeconds}} * 1000);

      function updateCountdown() {
        if (new Date() >= refreshAt) {
          location.reload();
        } else {
          setTimeout(updateCountdown, 100);
        }
      }

      // Start countdown
      updateCountdown();

      // Add some interactive effects
      document.addEventListener("mousemove", (e) => {
        const shapes = document.querySelectorAll(".shape");
        const mouseX = e.clientX / window.innerWidth;
        const mouseY = e.clientY / window.innerHeight;

        shapes.forEach((shape, index) => {
          const speed = (index + 1) * 0.5;
          const x = (mouseX - 0.5) * speed;
          const y = (mouseY - 0.5) * speed;

          shape.style.transform = `translate(${x}px, ${y}px)`;
        });
      });
    </script>
  </body>
</html>
